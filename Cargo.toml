[package]
name = "cs2-voice-extractor"
version = "0.1.0"
edition = "2024"
description = "Fast, update-resistant voice chat extraction from CS2 demos"
license = "MIT"
repository = "https://github.com/weeklyvillain/cs2-voice-extractor"
readme = "README.md"
keywords = ["cs2", "counter-strike", "demo", "voice", "opus"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
snap = "1.1.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
