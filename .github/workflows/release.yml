name: Release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Compute version (<major>.<minor> from Cargo.toml + run number)
        run: |
          base=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "([0-9]+)\.([0-9]+)\..*"/\1.\2/')
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            bin: cs2-voice-extractor.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x64
            bin: cs2-voice-extractor
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set version
        run: sed -i -E "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml

      - name: Test
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        env:
          # Static CRT on Windows so the .exe runs without the VC++ redistributable.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          dir="cs2-voice-extractor-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" README.md LICENSE "$dir/"
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
          "$dir/${{ matrix.bin }}" --version

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: cs2-voice-extractor-${{ matrix.name }}.*

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --target "${{ github.sha }}" \
            --title "v${VERSION}" \
            --generate-notes
